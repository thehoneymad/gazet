[package]
name = "cascade"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
rocksdb = { version = "0.24.0", default-features = false, features = ["lz4"] }
byteorder = "1.5.0"
bincode = "1.3"
morton = "0.3.0"
smallvec = {version = "1.15.1", features = ["serde"]}
itertools = "0.14.0"
tempfile = "3.23.0"
interval-heap = "0.0.5"
ordered-float = "5.1.0"
# Multi-phrase coalescing dependencies (from carmen-core)
generational-arena = "0.2"
fxhash = "0.2"
indexmap = "2.0"
fixedbitset = "0.5"
static-bushes = "0.1"

[dev-dependencies]
